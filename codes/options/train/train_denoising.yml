#### general settings
name: DF2K_Denoising
n_channels: 3
scale: 2
gpu_ids: [0]


#### datasets
datasets:
  train:
    name: DF2K_Waterloo
    mode: GT
    dataroot_GT: ~
    use_shuffle: true
    n_workers: 6
    batch_size: 16
    GT_size: 128
    use_flip: true
    use_rot: true
    color: RGB

  val:
    name: McMaster
    mode: GT
    noise_level: 25
    dataroot_GT: ~


# The optimization may not be stable for rescaling (+-0.1dB). A simple trick: for each stage of learning rate,
#  resume training from the best model of the previous stage of learning rate.
#### network structures
network_G:
  flowstep: 8
  nn_module: DenseBlock
  hidden_channels: 64
  condFlow:
    flowstep: 6
    flow_permutation: invconv
    flow_coupling: Affine
    feature_extractor: RRDB
    nn_module: FCN
    nn_module_last: Conv2dZeros
    hidden_channels: 96
    RRDB_nb: [2, 1]
    RRDB_nf: 96
    RRDB_gc: 24


#### path
path:
  pretrain_model_G: ~
  strict_load: true
  resume_state: auto

#### training settings: learning rate scheme, loss
train:
  weight_lf: !!float 1e-2
  weight_hf: !!float 1e-2

  lr: !!float 2e-4
  beta1: 0.9
  beta2: 0.99

  max_grad_clip: 5
  max_grad_norm: 100

  niter: 1000000
  lr_steps: [100000, 200000, 300000, 400000, 500000, 600000, 700000, 800000, 900000, 1000000]
  lr_gamma: 0.5

  noise_level: [5, 55]
  manual_seed: 0
  

#### validation settings
val:
  noise_level: 25
  val_freq: 5000


#### logger
logger:
  print_freq: 200
  save_checkpoint_freq: 5000
