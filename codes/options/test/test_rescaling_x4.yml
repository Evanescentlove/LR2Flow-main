#### general settings
name: DIV2K_x4_rescaling_test
n_channels: 3
scale: 4
gpu_ids: [0]


datasets:
  test_1:
    name: Set5
    mode: GTLQx
    dataroot_GT: ~
    dataroot_LQ: ~

  test_2:
    name: Set14
    mode: GTLQx
    dataroot_GT: ~
    dataroot_LQ: ~

  test_3:
    name: BSD100
    mode: GTLQx
    dataroot_GT: ~
    dataroot_LQ: ~

  test_4:
    name: Urban100
    mode: GTLQx
    dataroot_GT: ~
    dataroot_LQ: ~

  test_5:
    name: DIV2K-validation
    mode: GTLQx
    dataroot_GT: ~
    dataroot_LQ: ~


#### network structures
network_G:
  flowstep: [8, 8]
  nn_module: DenseBlock
  hidden_channels: 32
  condFlow:
    flowstep: [6, 6]
    flow_permutation: invconv
    flow_coupling: Affine
    feature_extractor: RRDB
    nn_module: FCN
    nn_module_last: Conv2dZeros
    hidden_channels: 80
    RRDB_nb: [2, 1]
    RRDB_nf: 80
    RRDB_gc: 20
  lf_flow:
    flowstep: 6
    hidden_channels: 32
    condFlow:
      flowstep: 4
      hidden_channels: 32
      RRDB_nb: [1, 1]
      RRDB_nf: 32
      RRDB_gc: 16


#### validation settings
val:
  heats: [0.0]
  n_sample: 1


path:
  strict_load: true
  load_submodule: ~
  pretrain_model_G: ../experiments/pretrained_models/rescaling_x4.pth
