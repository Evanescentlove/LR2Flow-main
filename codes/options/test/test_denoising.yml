#### general settings
name: Denoising_noise-level_15
n_channels: 3
noise_level: 15
scale: 2
gpu_ids: [0]


#### datasets
datasets:
  test_1:
    name: CBSD68
    mode: GT
    dataroot_GT: ~

  test_2:
    name: Kodak24
    mode: GT
    dataroot_GT: ~

  test_3:
    name: McMaster
    mode: GT
    dataroot_GT: ~

  test_4:
    name: Urban100
    mode: GT
    dataroot_GT: ~


#### network structures
network_G:
  flowstep: 8
  nn_module: DenseBlock
  hidden_channels: 64
  condFlow:
    flowstep: 6
    flow_permutation: invconv
    flow_coupling: Affine
    feature_extractor: RRDB
    nn_module: FCN
    nn_module_last: Conv2dZeros
    hidden_channels: 96
    RRDB_nb: [2, 1]
    RRDB_nf: 96
    RRDB_gc: 24


#### validation settings
val: 
  noise_level: 15
  self_ensemble: true


#### path
path:
  strict_load: true
  load_submodule: ~
  pretrain_model_G: ../experiments/pretrained_models/denoising.pth
